<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: Cinzel;
      src: url("./cinzel.ttf") format("truetype");
      font-weight: 400 900;
      font-style: normal;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0c1210;
    }
    .stage {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0c1210;
    }
    .hero {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      filter: saturate(1.05) contrast(1.08) brightness(0.92);
    }
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 78% 86% at 50% 40%, transparent 0%, rgba(12, 18, 16, 0.12) 55%, rgba(12, 18, 16, 0.62) 100%),
        linear-gradient(to top, rgba(12, 18, 16, 0.42) 0%, transparent 32%),
        linear-gradient(to bottom, rgba(12, 18, 16, 0.28) 0%, transparent 24%);
      pointer-events: none;
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 78%;
      pointer-events: none;
    }
    .mark {
      width: 34px;
      height: 34px;
      margin: 0 auto 16px;
      filter: drop-shadow(0 2px 6px rgba(12, 18, 16, 0.8));
    }
    .title {
      font-family: Cinzel, "Liberation Serif", serif;
      font-weight: 700;
      font-size: 164px;
      line-height: 0.9;
      letter-spacing: 0.2em;
      color: #f1ebe0;
      text-indent: 0.2em;
      margin: 0;
      padding: 0;
      text-shadow:
        0 1px 0 rgba(12, 18, 16, 0.7),
        0 4px 14px rgba(12, 18, 16, 0.9),
        0 12px 40px rgba(12, 18, 16, 0.75),
        0 0 60px rgba(12, 18, 16, 0.55);
    }
    .rule {
      width: 152px;
      height: 2px;
      margin: 20px auto 0;
      background: linear-gradient(to right, transparent, #7eb8a8 16%, #7eb8a8 84%, transparent);
      opacity: 0.95;
      filter: drop-shadow(0 2px 6px rgba(12, 18, 16, 0.8));
    }
  </style>
</head>
<body>
  <div class="stage">
    <img class="hero" src="./warden.jpg" alt="" />
    <div class="vignette"></div>
    <div class="lockup">
      <svg class="mark" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
        <circle cx="18" cy="20" r="9.5" fill="none" stroke="#7eb8a8" stroke-width="1.6"/>
        <path d="M18 6.5 V12.5" stroke="#7eb8a8" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M14.5 9.2 Q18 7.4 21.5 9.2" fill="none" stroke="#f1ebe0" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="18" cy="20" r="2.2" fill="#f1ebe0"/>
      </svg>
      <h1 class="title">WARD</h1>
      <div class="rule"></div>
    </div>
  </div>
</body>
</html>
