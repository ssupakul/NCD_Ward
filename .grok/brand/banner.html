<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: Cinzel;
      src: url("./cinzel.ttf") format("truetype");
      font-weight: 400 900;
      font-style: normal;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 264px;
      overflow: hidden;
      background: #0c1210;
    }
    .stage {
      position: relative;
      width: 1200px;
      height: 264px;
      overflow: hidden;
      background: #0c1210;
    }
    .hero {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 68% 16%;
      filter: saturate(1.05) contrast(1.08) brightness(0.95);
    }
    .vignette {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, rgba(12, 18, 16, 0.78) 0%, rgba(12, 18, 16, 0.48) 32%, rgba(12, 18, 16, 0.08) 62%, rgba(12, 18, 16, 0.28) 100%),
        linear-gradient(to top, rgba(12, 18, 16, 0.38) 0%, transparent 42%),
        linear-gradient(to bottom, rgba(12, 18, 16, 0.22) 0%, transparent 44%);
      pointer-events: none;
    }
    .lockup {
      position: absolute;
      left: 52px;
      top: 38px;
      width: 500px;
      pointer-events: none;
    }
    .mark {
      width: 22px;
      height: 22px;
      margin: 0 0 10px 2px;
      filter: drop-shadow(0 2px 6px rgba(12, 18, 16, 0.8));
    }
    .title {
      font-family: Cinzel, "Liberation Serif", serif;
      font-weight: 700;
      font-size: 88px;
      line-height: 0.9;
      letter-spacing: 0.2em;
      color: #f1ebe0;
      text-indent: 0.2em;
      margin: 0;
      padding: 0;
      text-shadow:
        0 1px 0 rgba(12, 18, 16, 0.7),
        0 4px 14px rgba(12, 18, 16, 0.9),
        0 8px 28px rgba(12, 18, 16, 0.7);
    }
    .rule {
      width: 112px;
      height: 2px;
      margin: 12px 0 0 6px;
      background: linear-gradient(to right, #7eb8a8, transparent);
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="stage">
    <img class="hero" src="./warden.jpg" alt="" />
    <div class="vignette"></div>
    <div class="lockup">
      <svg class="mark" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
        <circle cx="18" cy="20" r="9.5" fill="none" stroke="#7eb8a8" stroke-width="1.6"/>
        <path d="M18 6.5 V12.5" stroke="#7eb8a8" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M14.5 9.2 Q18 7.4 21.5 9.2" fill="none" stroke="#f1ebe0" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="18" cy="20" r="2.2" fill="#f1ebe0"/>
      </svg>
      <h1 class="title">WARD</h1>
      <div class="rule"></div>
    </div>
  </div>
</body>
</html>
